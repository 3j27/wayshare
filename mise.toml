[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"cargo:bindgen-cli" = "0.73.2"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.gen-vaapi-sys]
description = "Regenerate the libva bindings (Linux, needs libva headers and clang)"
run = "tools/gen-vaapi-sys.sh > src/encode/vaapi/sys.rs"

[tasks.install]
description = "Install the release build (PREFIX defaults to /usr/local)"
depends = ["build"]
run = "tools/install.sh"

[tasks.uninstall]
description = "Remove what install put in place"
run = "tools/install.sh --uninstall"
