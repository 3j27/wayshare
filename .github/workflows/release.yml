name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Cargo.toml and CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$version\"" Cargo.toml || { echo "::error::Cargo.toml isn't at $version"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no $version section"; exit 1; }

  build:
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl-dev libgbm-dev
      - run: rustup toolchain install
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=wayshare-${{ matrix.target }}
          mkdir "$name"
          cp target/release/wayshare LICENSE README.md contrib/config.example.toml "$name"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: wayshare-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: wayshare-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums and notes
        run: |
          (cd dist && sha256sum *.tar.gz > sha256sums.txt)
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## / { on = index($0, "## " v " ") == 1; next } on' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh
          \`\`\`

          Or with [mise](https://mise.jdx.dev): \`mise use -g github:$GITHUB_REPOSITORY\`, then
          \`wayshare install-service\`

          Then follow [Set up](https://github.com/$GITHUB_REPOSITORY#set-up).

          ## Verify

          Checksums are in \`sha256sums.txt\`. Each archive also has a build attestation:

          \`\`\`sh
          gh attestation verify wayshare-x86_64-unknown-linux-gnu.tar.gz -R $GITHUB_REPOSITORY
          \`\`\`
          EOF
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
